<style>
  :root {
    --primary: #2F4C6B;
    --primary-light: #5B7A99;
    --accent: #C97B4A;
    --text: #2B2E33;
    --muted: #8A929B;
    --bg: #F8F6F3;
    --border: #E3E6EA;
    --billy-tan: #C99A46;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif;
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 {
    font-weight: 700;
    line-height: 1.5;
    margin: 0;
  }

  a { color: inherit; }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 28px;
  }

  /* ---------- Header ---------- */
  .site-header {
    background: var(--primary);
    border-bottom: 4px solid var(--billy-tan);
    padding: 14px 0;
  }
  .site-header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .site-header .logo-link {
    display: inline-flex;
    align-items: center;
    color: #fff;
    line-height: 0;
  }
  .site-header .logo-link svg {
    height: 26px;
    width: auto;
    display: block;
  }
  .site-header nav a {
    color: #fff;
    text-decoration: none;
    font-size: 0.92rem;
    margin-left: 24px;
    opacity: 0.9;
  }
  .site-header nav a:hover { opacity: 1; text-decoration: underline; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 64px 0 80px;
    opacity: 0;
    animation: rise 0.9s ease-out forwards;
  }
  .hero-badge {
    position: absolute;
    top: -10%;
    right: -6%;
    width: 320px;
    height: auto;
    color: var(--primary-light);
    opacity: 0.16;
    pointer-events: none;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero { animation: none; opacity: 1; }
  }

  .hero .wrap {
    position: relative;
    z-index: 1;
  }

  .hero p.eyebrow {
    color: var(--primary-light);
    font-size: 0.95rem;
    margin: 0 0 18px;
    font-weight: 500;
  }

  .hero h1 {
    font-size: 2.5rem;
    max-width: 13ch;
    color: var(--primary);
  }
  .hero h1 span {
    display: inline-block;
    white-space: nowrap;
  }

  .hero .lede {
    margin-top: 24px;
    font-size: 1.05rem;
    color: var(--text);
    max-width: 42ch;
  }

  /* ---------- Section shell ---------- */
  section { padding: 56px 0; }
  section + section { border-top: 1px solid var(--border); }

  .section-head { margin-bottom: 40px; }
  .section-head h2 { font-size: 1.6rem; color: var(--primary); }
  .section-head p { color: var(--muted); margin-top: 12px; font-size: 0.98rem; }

  /* ---------- Apps list ---------- */
  #apps-list { list-style: none; margin: 0; padding: 0; }
  .app-row {
    display: flex;
    gap: 20px;
    padding: 28px 0;
    border-bottom: 1px dashed var(--border);
  }
  .app-row:first-child { padding-top: 0; }
  .app-row:last-child { border-bottom: none; }

  .app-icon {
    flex: none;
    width: 52px; height: 52px;
    border-radius: 14px;
    background: #fff;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    overflow: hidden;
  }
  .app-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .app-body { flex: 1; min-width: 0; }
  .app-body h3 { font-size: 1.1rem; color: var(--text); }
  .app-body .desc {
    margin-top: 6px;
    color: var(--muted);
    font-size: 0.94rem;
  }
  .app-body .meta {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .price-tag {
    font-size: 0.82rem;
    padding: 3px 10px;
    border-radius: 999px;
    background: #EAF0F5;
    color: var(--primary);
  }
  .price-tag.paid {
    background: rgba(201,123,74,0.15);
    color: var(--accent);
  }
  .app-link {
    font-size: 0.9rem;
    text-decoration: none;
    color: var(--accent);
    border-bottom: 1px solid currentColor;
  }

  .empty-note {
    color: var(--muted);
    font-size: 0.94rem;
  }

  /* ---------- About ---------- */
  .about p { margin: 0 0 18px; color: var(--text); font-size: 0.98rem; max-width: 56ch; }
  .about p:last-child { margin-bottom: 0; }

  /* ---------- Footer ---------- */
  .site-footer {
    background: var(--primary);
    border-top: 4px solid var(--billy-tan);
    padding: 20px 0;
  }
  .site-footer .wrap {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 0.8rem;
  }

  @media (max-width: 560px) {
    .hero h1 { font-size: 2rem; }
    .app-row { gap: 14px; }
    .app-icon { width: 44px; height: 44px; font-size: 1.2rem; }
  }
</style>

    </div>

    </div>

<footer class="site-footer">

  </div>

<script>
  async function loadApps() {
    const list = document.getElementById('apps-list');
    try {
      const res = await fetch('apps.json', { cache: 'no-store' });
      const apps = await res.json();

      if (!apps.length) {
        list.innerHTML = '<li class="empty-note">近日公開予定です。もうしばらくお待ちください。</li>';
        return;
      }

      const isImageIcon = icon => /\.(png|jpe?g|svg|webp)$/i.test(icon || '');

      list.innerHTML = apps.map(app => `
        <li class="app-row">
          <div class="app-icon">${isImageIcon(app.icon) ? `<img src="${app.icon}" alt="" loading="lazy">` : (app.icon || '🧰')}</div>
          <div class="app-body">
            <h3>${app.name}</h3>
            <p class="desc">${app.description}</p>
            <div class="meta">
              <span class="price-tag ${app.price === '無料' ? '' : 'paid'}">${app.price || '無料'}</span>
              <a class="app-link" href="${app.url}" target="_blank" rel="noopener">アプリを開く</a>
            </div>
          </div>
        </li>
      `).join('');
    } catch (e) {
      list.innerHTML = '<li class="empty-note">近日公開予定です。もうしばらくお待ちください。</li>';
    }
  }
  loadApps();
</script>
